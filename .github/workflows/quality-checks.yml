name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

env:
  CI: true

jobs:
  branch-name:
    name: Branch Name
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate branch naming convention
        env:
          BRANCH_NAME: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: node ./scripts/check-branch-name.js

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Expo Router types
        # `.expo/types/router.d.ts` is gitignored and only ever written by the Metro dev server
        # started via `expo start` (NOT `expo export`, which skips this side effect entirely).
        # Without it, `useSegments()` & friends fall back to untyped `string` routes and `tsc`
        # fails with false-positive tuple-index errors (e.g. "Tuple type '[string]' of length '1'
        # has no element at index '1'") that never reproduce locally once a dev server has run once.
        # So: boot the dev server just long enough for it to write the types file, then kill it.
        run: |
          npx expo start --port 8321 > /tmp/expo-start.log 2>&1 &
          EXPO_PID=$!
          for i in $(seq 1 60); do
            if [ -f .expo/types/router.d.ts ]; then break; fi
            sleep 1
          done
          kill "$EXPO_PID" 2>/dev/null || true
          if [ ! -f .expo/types/router.d.ts ]; then
            echo "::error::.expo/types/router.d.ts was not generated in time"
            cat /tmp/expo-start.log
            exit 1
          fi

      - name: Run type check
        run: yarn check:types

  boundaries:
    name: Architecture Boundaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check src/app boundary rules
        run: yarn check:boundaries

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run unit tests
        run: npx dotenv -e .env.test -- yarn test
